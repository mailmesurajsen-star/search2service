version: '3.8'

# Search2Service — for Dokploy "Compose" deployments (or plain `docker compose up`
# on any VPS). One app container (Next.js frontend + FastAPI backend, started
# together by start.sh) behind an nginx reverse proxy.
#
# Env vars (set these in Dokploy's Environment tab, or a local .env file):
#   JWT_SECRET      required — generate with `openssl rand -hex 32`
#   CORS_ORIGINS    optional — defaults to *, tighten to your domain in production
#   DB_ENGINE       optional — sqlite (default) or mysql
#   MYSQL_HOST / MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE — only if DB_ENGINE=mysql

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - set it in Dokploy's Environment tab}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      DB_ENGINE: ${DB_ENGINE:-sqlite}
      SQLITE_PATH: /app/backend/data/search2service.db
      MYSQL_HOST: ${MYSQL_HOST:-}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_USER: ${MYSQL_USER:-}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-}
      EMERGENT_LLM_KEY: ${EMERGENT_LLM_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      # Persists the SQLite database (and uploaded files, which live inside it)
      # across redeploys — without this, every redeploy starts with an empty DB.
      - app_data:/app/backend/data
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  app_data:
