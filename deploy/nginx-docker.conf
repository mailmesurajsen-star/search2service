# nginx reverse proxy for the `nginx` service in docker-compose.yml.
# Plain HTTP on port 80 — Dokploy's own Traefik sits in front of this and
# handles the public domain + SSL certificate, then forwards to this
# container's port 80. No certbot/SSL setup needed here.

server {
    listen 80;
    server_name _;

    client_max_body_size 12m;  # a bit above the app's own 10MB upload limit

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
